<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks | {{BUSINESS_NAME}}</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--brand:#14532D;--brand-dark:#0B3B1F;--accent:#F59E0B;--accent-ink:#3B2300}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,var(--brand-dark),var(--brand));color:#fff;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px}
  h1{font-family:Manrope,sans-serif;font-size:clamp(30px,5vw,44px);margin:0 0 12px}
  p{color:rgba(255,255,255,.85);font-size:18px;max-width:520px;margin:0 auto 26px;line-height:1.6}
  a{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none;padding:14px 24px;border-radius:999px;margin:4px}
</style>
</head>
<body>
  <div>
    <h1>Thanks, we've got your message</h1>
    <p>We'll get back to you as soon as we can. If it's urgent, give us a ring.</p>
    <a href="tel:{{PHONE_TEL}}">Call {{PHONE_DISPLAY}}</a>
    <a href="/">Back to the homepage</a>
  </div>
</body>
</html>
